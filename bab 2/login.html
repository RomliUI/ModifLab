<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ModifLab Planner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #2b2b2b; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background-color: #383838; padding: 30px; border-radius: 12px; width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        .logo-box { width: 60px; height: 60px; background: #4a4a4a; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 1px solid #5c5c5c; }
        h2 { margin-bottom: 5px; font-size: 20px; }
        p.sub { font-size: 12px; color: #aaa; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #ccc; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #555; background: #222; color: #fff; font-size: 14px; }
        .btn { width: 100%; padding: 10px; background: #ff7b00; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #e06d00; }
        .link-text { font-size: 12px; margin-top: 15px; color: #aaa; }
        .link-text a { color: #4da6ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">GARAGE</div>
        <h2>Login</h2>
        <p class="sub">Masukkan kredensial Anda untuk mengakses akun</p>
        <form action="dashboard.html">
            <div class="form-group">
                <label>Nama Pengguna</label>
                <input type="text" placeholder="Masukkan Nama Pengguna" required>
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" placeholder="Masukkan Kata Sandi" required>
            </div>
            <button type="submit" class="btn">Masuk</button>
        </form>
        <div class="link-text">Belum punya akun? <a href="register.html">Daftar di sini</a></div>
    </div>
</body>
</html>
